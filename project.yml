name: Pinshot
options:
  bundleIdPrefix: dev.portfolio
  developmentLanguage: ja
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  Pinshot:
    type: application
    platform: macOS
    sources:
      - path: Pinshot
    info:
      path: Pinshot/Info.plist
      properties:
        CFBundleDisplayName: Pinshot
        # 日本語のアプリだと宣言する（しないと、文字の欄の右クリックなど、macOS の部品が英語で出る）
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations:
          - ja
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        # Dock に出さず、メニューバーだけに常駐する
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.portfolio.pinshot
        # アプリのアイコン（scripts/make-app-icon.swift で描いて書き出す）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 開発中はアドホック署名。Xcode で Team を設定すると、画面収録の許可が再ビルドで外れにくくなる
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
    scheme:
      testTargets:
        - PinshotTests

  # 画面に関係ない処理（書き込みのデータ・保存する形・書き出し・録画やアップロードの決まりなど）のテスト。
  # アプリを起動せずに動かせるよう、使うソースをテストに直接入れる
  PinshotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PinshotTests
      - path: Pinshot/Editor/RGBAColor.swift
      - path: Pinshot/Editor/Tool.swift
      - path: Pinshot/Editor/AnnotationStyles.swift
      - path: Pinshot/Editor/Annotation.swift
      - path: Pinshot/Editor/EditorStyle.swift
      - path: Pinshot/Editor/EditHistory.swift
      - path: Pinshot/Editor/AnnotationDocument.swift
      - path: Pinshot/Editor/EditHandle.swift
      - path: Pinshot/Editor/AnnotationRenderer.swift
      - path: Pinshot/Editor/ImageEffects.swift
      - path: Pinshot/Editor/ImageExporter.swift
      - path: Pinshot/Pin/ResizeEdges.swift
      - path: Pinshot/Settings/ExportDecoration.swift
      - path: Pinshot/Settings/Shortcut.swift
      - path: Pinshot/Screenshot/CaptureTypes.swift
      - path: Pinshot/Support/GraphicsHelpers.swift
      - path: Pinshot/Support/ScreenGeometry.swift
      - path: Pinshot/Support/PercentText.swift
      - path: Pinshot/Editor/TextRecognizer.swift
      - path: Pinshot/Editor/TextMarkLayout.swift
      - path: Pinshot/Recording/RecordingRules.swift
      - path: Pinshot/Recording/GIFExporter.swift
      - path: Pinshot/Support/SaveLocation.swift
      - path: Pinshot/Support/StoredJSON.swift
      - path: Pinshot/History/CaptureHistoryEntry.swift
      - path: Pinshot/History/TextHistoryEntry.swift
      - path: Pinshot/History/ListSelection.swift
      - path: Pinshot/Pin/SavedPin.swift
      - path: Pinshot/Upload/UploadTypes.swift
      - path: Pinshot/Upload/UploadRules.swift
      - path: Pinshot/Upload/UploadHistoryEntry.swift
      - path: Pinshot/Upload/OAuth/PKCE.swift
      - path: Pinshot/Upload/OAuth/OAuthConfiguration.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.portfolio.pinshot.tests
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
